services:
  nginx:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    container_name: 3xui-fallback
    restart: unless-stopped
    network_mode: host
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN}"
      MOSQUITO_SWATTER_EVENTS: "0"

      PANEL_HTTPS_PORT: "${PANEL_HTTPS_PORT}"
      SUBS_HTTPS_PORT: "${SUBS_HTTPS_PORT}"
      PANEL_ALLOWED_CIDR: "${PANEL_ALLOWED_CIDR}"
      PANEL_PATH_PREFIX: "${PANEL_PATH_PREFIX}"
      SUBS_PATH_PREFIX: "${SUBS_PATH_PREFIX}"
      SUBS_JSON_PATH_PREFIX: "${SUBS_JSON_PATH_PREFIX:-}"

      PANEL_BACKEND_SCHEME: "${PANEL_BACKEND_SCHEME}"
      PANEL_BACKEND_HOST: "${PANEL_BACKEND_HOST}"
      PANEL_BACKEND_PORT: "${PANEL_BACKEND_PORT}"
      PANEL_BACKEND_TLS_NAME: "${PANEL_BACKEND_TLS_NAME:-}"
      PANEL_BACKEND_SSL_VERIFY: "${PANEL_BACKEND_SSL_VERIFY:-off}"

      SUBS_BACKEND_SCHEME: "${SUBS_BACKEND_SCHEME}"
      SUBS_BACKEND_HOST: "${SUBS_BACKEND_HOST}"
      SUBS_BACKEND_PORT: "${SUBS_BACKEND_PORT}"
      SUBS_BACKEND_TLS_NAME: "${SUBS_BACKEND_TLS_NAME:-}"
      SUBS_BACKEND_SSL_VERIFY: "${SUBS_BACKEND_SSL_VERIFY:-off}"
    command: ["/bin/sh", "/etc/nginx/render.sh"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./render.sh:/etc/nginx/render.sh:ro
      - ./swatter.js:/etc/nginx/swatter.js:ro
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./subs-proxy.conf:/etc/nginx/templates/subs-proxy.conf.template:ro
      - ./html:/usr/share/nginx/html:ro
      - ${SSL_CERT_FULLCHAIN_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_CERT_PRIVKEY_PATH}:/etc/nginx/certs/privkey.pem:ro
