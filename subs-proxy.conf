            # Shared by every subscription location; render.sh writes it to /etc/nginx/subs-proxy.conf.
            # The caller sets $subs_forwarded_prefix to its own location prefix.
            proxy_pass ${SUBS_BACKEND_SCHEME}://${SUBS_BACKEND_HOST}:${SUBS_BACKEND_PORT};
            proxy_http_version 1.1;
            proxy_buffering off;
            # 3x-ui subscription headers such as Per-App-Proxy-List exceed the one-page (4k/8k) default.
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            proxy_ssl_verify ${SUBS_BACKEND_SSL_VERIFY};
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name ${SUBS_BACKEND_TLS_NAME};
            proxy_redirect ~^https?://[^/]+(/.*)$ https://${SITE_DOMAIN}:${SUBS_HTTPS_PORT}$1;

            proxy_set_header Host ${SITE_DOMAIN};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host ${SITE_DOMAIN};
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix $subs_forwarded_prefix;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
