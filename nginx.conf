load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;

    # Before the first map: it fixes the size for all maps. The sponsors map key holds
    # PANEL_PATH_PREFIX; the default 64 fails to start from a 36-character prefix.
    map_hash_bucket_size 256;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map "${MOSQUITO_SWATTER_EVENTS}" $swatter_log {
        default 0;
        1 1;
    }

    # PANEL_HIDE_SPONSORS=1: 3x-ui fetches the sponsors list from GitHub; serve an empty one instead.
    map "${PANEL_HIDE_SPONSORS}:$uri" $panel_static {
        default /__panel_proxy__;
        "1:${PANEL_PATH_PREFIX}/sponsors" /sponsors-empty.json;
    }

    map $swatter_log $swatter_legacy_log {
        0 1;
        default 0;
    }
    js_import audit from /etc/nginx/swatter.js;
    js_var $swatter_panel_prefix "${PANEL_PATH_PREFIX}";
    js_var $swatter_subs_prefix "${SUBS_PATH_PREFIX}";
    js_var $swatter_subs_json_prefix "${SUBS_JSON_PATH_PREFIX}";
    js_var $swatter_host "${SITE_DOMAIN}";
    js_set $swatter_event audit.event;
    log_format swatter escape=none '$swatter_event';

    # Host extensions (http context), e.g. maps. Mounted by docker-compose.override.yml; may be absent.
    include /etc/nginx/sites/http/*.conf;

    server {
        listen ${PANEL_HTTPS_PORT} ssl;
        listen [::]:${PANEL_HTTPS_PORT} ssl;
        http2 on;
        server_name ${SITE_DOMAIN};
        absolute_redirect off;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        access_log /var/log/nginx/panel_access.log combined if=$swatter_legacy_log;
        access_log /var/log/swatter/http.jsonl swatter if=$swatter_log;
        error_log  /var/log/nginx/panel_error.log warn;

        # 3x-ui database import uploads x-ui.db, which can exceed the 1m default.
        client_max_body_size 50m;

        if ($host != ${SITE_DOMAIN}) {
            return 444;
        }

        proxy_intercept_errors on;
        error_page 400 /400.html;
        error_page 401 /401.html;
        # A denied client must not tell the hidden panel path apart from any other 404.
        error_page 403 =404 /404.html;
        error_page 404 /404.html;
        error_page 405 /405.html;
        error_page 500 /500.html;
        error_page 502 /502.html;
        error_page 503 /503.html;
        error_page 504 /504.html;

        location = /_swatter_panel_denied.html {
            internal;
            alias /usr/share/nginx/html/404.html;
        }

        # Do not serve or proxy dotfiles such as .env and .git.
        location ~ (^|/)\.(?!well-known(?:/|$)) {
            return 404;
        }

        # return runs before allow/deny, so redirect from try_files, which runs after them.
        location = ${PANEL_PATH_PREFIX} {
            # Location error_page replaces inheritance: retain the other server mappings.
            error_page 400 /400.html;
            error_page 401 /401.html;
            error_page 403 =404 /_swatter_panel_denied.html;
            error_page 404 /404.html;
            error_page 405 /405.html;
            error_page 500 /500.html;
            error_page 502 /502.html;
            error_page 503 /503.html;
            error_page 504 /504.html;
            include /etc/nginx/panel-allow.conf;
            deny all;
            try_files /nonexistent-panel-slash @panel_add_slash;
        }

        location @panel_add_slash {
            return 301 ${PANEL_PATH_PREFIX}/;
        }

        location ${PANEL_PATH_PREFIX}/ {
            # Location error_page replaces inheritance: retain the other server mappings.
            error_page 400 /400.html;
            error_page 401 /401.html;
            error_page 403 =404 /_swatter_panel_denied.html;
            error_page 404 /404.html;
            error_page 405 /405.html;
            error_page 500 /500.html;
            error_page 502 /502.html;
            error_page 503 /503.html;
            error_page 504 /504.html;
            include /etc/nginx/panel-allow.conf;
            deny all;

            # try_files runs after allow/deny (return would not), so a denied client never sees the stub.
            # shortcut: /sponsors/logo/<name> stays proxied; the UI requests no logos for an empty list.
            # Stub it too if 3x-ui starts loading logos without the list.
            # With the flag on, non-GET requests to /sponsors get 405 from the static module.
            root /usr/share/nginx/html;
            try_files $panel_static @panel_backend;
        }

        location @panel_backend {
            proxy_pass ${PANEL_BACKEND_SCHEME}://${PANEL_BACKEND_HOST}:${PANEL_BACKEND_PORT};
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_ssl_verify ${PANEL_BACKEND_SSL_VERIFY};
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name ${PANEL_BACKEND_TLS_NAME};
            proxy_redirect ~^https?://[^/]+(/.*)$ https://${SITE_DOMAIN}:${PANEL_HTTPS_PORT}$1;

            proxy_set_header Host ${SITE_DOMAIN};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host ${SITE_DOMAIN};
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix ${PANEL_PATH_PREFIX};
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            return 404;
        }

        location = /error-pages.css {
            root /usr/share/nginx/html;
        }

        location ~ ^/(400|401|403|404|405|500|502|503|504)\.html$ {
            root /usr/share/nginx/html;
            internal;
        }
    }

    server {
        listen ${SUBS_HTTPS_PORT} ssl;
        listen [::]:${SUBS_HTTPS_PORT} ssl;
        http2 on;
        server_name ${SITE_DOMAIN};
        absolute_redirect off;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        access_log /var/log/nginx/subs_access.log combined if=$swatter_legacy_log;
        access_log /var/log/swatter/http.jsonl swatter if=$swatter_log;
        error_log  /var/log/nginx/subs_error.log warn;

        if ($host != ${SITE_DOMAIN}) {
            return 444;
        }

        proxy_intercept_errors on;
        error_page 400 /400.html;
        error_page 401 /401.html;
        error_page 403 /403.html;
        error_page 404 /404.html;
        error_page 405 /405.html;
        error_page 500 /500.html;
        error_page 502 /502.html;
        error_page 503 /503.html;
        error_page 504 /504.html;

        # Do not serve or proxy dotfiles such as .env and .git.
        location ~ (^|/)\.(?!well-known(?:/|$)) {
            return 404;
        }

        # Host extensions (subscription server context), e.g. extra locations.
        include /etc/nginx/sites/subs/*.conf;

        location ${SUBS_PATH_PREFIX}/ {
            set $subs_forwarded_prefix ${SUBS_PATH_PREFIX};
            include /etc/nginx/subs-proxy.conf;
        }

        # render.sh writes the SUBS_JSON_PATH_PREFIX location here; empty when it is unset.
        include /etc/nginx/subs-json.conf;

        location / {
            return 404;
        }

        location = /error-pages.css {
            root /usr/share/nginx/html;
        }

        location ~ ^/(400|401|403|404|405|500|502|503|504)\.html$ {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
